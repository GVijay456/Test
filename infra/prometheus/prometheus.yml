global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: aai-services
    static_configs:
      - targets:
          - "auth:9090"
          - "agent-api:9090"
          - "orchestrator:9090"
          - "llm-proxy:9090"
    # services expose metrics on :9090/metrics (separate port, not the app port)
    metrics_path: /metrics
