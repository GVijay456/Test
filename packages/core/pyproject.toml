[project]
name = "aai-core"
version = "0.1.0"
description = "Agentic AI Platform — core domain types, adapter ABCs, config"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-ulid>=3.0",
    "tiktoken>=0.8",
    "PyYAML>=6.0",
    "cryptography>=43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aai_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
